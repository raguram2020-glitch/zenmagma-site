<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:linear-gradient(rgba(8,4,20,.45),rgba(8,4,20,.6)),url('../assets/game-art/color-flood/candy-bg.jpg') center/cover no-repeat,#0c0518;font-family:"Segoe UI",sans-serif;color:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;overflow:hidden}
canvas{border-radius:16px;box-shadow:0 8px 40px rgba(0,0,0,.6),0 0 0 4px rgba(255,255,255,.08);max-width:100vw}
#c{max-height:60vh!important;max-width:60vh!important}
#hud{display:flex;gap:16px;align-items:center;padding:8px 0;flex-wrap:wrap;justify-content:center}
.hval{background:rgba(255,255,255,.14);padding:5px 16px;border-radius:20px;font-weight:700;font-size:.9em;box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
.btn{padding:10px 24px;border-radius:25px;border:none;font-size:.9em;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#FFD93D,#FF6B6B,#C77DFF);color:#fff;transition:.2s;box-shadow:0 6px 16px rgba(199,125,255,.35)}
.btn:hover{transform:scale(1.05)}
#ov{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.8);z-index:50}
#ob{background:#1a1030;border-radius:20px;padding:40px;text-align:center;max-width:380px;width:90%;border:2px solid #C77DFF}
#ob h2{font-size:2em;margin-bottom:8px;background:linear-gradient(135deg,#FFD93D,#FF6B6B,#C77DFF);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
#ob p{color:#aaa;margin-bottom:22px;line-height:1.5}
#hm{position:fixed;top:10px;left:10px;padding:6px 14px;border-radius:18px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);color:#fff;cursor:pointer;font-size:.8em;z-index:100}
.candy-btn{border-radius:50%;border:3px solid rgba(255,255,255,.9);cursor:pointer;transition:transform .15s ease;box-shadow:0 5px 12px rgba(0,0,0,.4),inset 0 -4px 7px rgba(0,0,0,.25),inset 0 3px 5px rgba(255,255,255,.55)}
.candy-btn:hover{transform:scale(1.12)}
.candy-btn:active{transform:scale(.9)}
</style></head><body>


<a id="hm" href="../index.html" style="position:fixed;top:12px;left:14px;z-index:200;color:rgba(255,255,255,0.7);text-decoration:none;font-size:14px;font-weight:700;background:rgba(0,0,0,0.4);padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.2);">← Home</a>
<div id="hud"><span class="hval">Moves:<b id="mv"> 0</b>/<b id="mx">25</b></span><span class="hval">Score:<b id="sc"> 0</b></span><span class="hval">Level:<b id="lv"> 1</b></span></div>
<canvas id="c" width="360" height="360"></canvas>
<div style="display:flex;gap:10px;justify-content:center;padding:8px" id="clrs"></div>
<div id="ov"><div id="ob"><h2>Color Flood</h2><p>Click a color to flood the top-left corner outward. Fill the entire board in limited moves!</p><button class="btn" onclick="go()">Play!</button></div></div>
<div id="fail-ov" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:200;align-items:center;justify-content:center;"><div style="background:#1a1030;border-radius:20px;padding:36px;text-align:center;max-width:340px;width:90%;border:2px solid #C77DFF"><h2 style="font-size:1.8em;margin-bottom:12px;color:#ff6b6b">Out of Moves!</h2><p style="color:#aaa;margin-bottom:20px">Score: <b id="fail-sc" style="color:#fff">0</b></p><button class="btn" onclick="document.getElementById('fail-ov').style.display='none';ng();go();">Try Again</button></div></div>
<script>

// === Sound Engine ===
const AC=new(window.AudioContext||window.webkitAudioContext)();
function beep(freq=440,dur=0.08,vol=0.15,type='square'){
  try{const o=AC.createOscillator(),g=AC.createGain();
  o.connect(g);g.connect(AC.destination);
  o.type=type;o.frequency.value=freq;
  g.gain.setValueAtTime(vol,AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
  o.start();o.stop(AC.currentTime+dur);}catch(e){}
}
function sndScore(){beep(660,0.07,0.12,'square');}
function sndHit(){beep(180,0.15,0.18,'sawtooth');}
function sndLose(){beep(120,0.4,0.2,'sawtooth');setTimeout(()=>beep(80,0.4,0.2,'sawtooth'),200);}
function sndWin(){beep(880,0.1,0.15);setTimeout(()=>beep(1100,0.1,0.15),120);setTimeout(()=>beep(1320,0.2,0.15),240);}
function sndJump(){beep(300,0.08,0.1,'sine');}
function sndCollect(){beep(780,0.06,0.12,'sine');}
// Resume AudioContext on first interaction
document.addEventListener('click',()=>AC.state==='suspended'&&AC.resume(),{once:true});

function showGameOver(msg){
  sndLose();
  const el=document.getElementById('goov');
  if(el){document.getElementById('gomsg').textContent=msg||'';el.style.display='flex';}
}
function showWin(msg){
  sndWin();
  const el=document.getElementById('winov');
  if(el){document.getElementById('winmsg').textContent=msg||'';el.style.display='flex';}
}

const cv=document.getElementById("c"),ctx=cv.getContext("2d");
const N=12,SZ=30;
const COLORS=["#e74c3c","#3498db","#2ecc71","#f39c12","#9b59b6","#1abc9c"];
let grid=[],moves=0,maxMoves=25,score=0,level=1,running=false;

function lighten(hex,amt){return '#'+hex.replace(/^#/,'').replace(/../g,c=>Math.min(255,parseInt(c,16)+amt).toString(16).padStart(2,'0'));}
function darken(hex,amt){return '#'+hex.replace(/^#/,'').replace(/../g,c=>Math.max(0,parseInt(c,16)-amt).toString(16).padStart(2,'0'));}
function roundRect(x,y,w,h,r){
  if(typeof r==='number')r=[r,r,r,r];
  ctx.beginPath();
  ctx.moveTo(x+r[0],y);
  ctx.lineTo(x+w-r[1],y);ctx.arcTo(x+w,y,x+w,y+r[1],r[1]);
  ctx.lineTo(x+w,y+h-r[2]);ctx.arcTo(x+w,y+h,x+w-r[2],y+h,r[2]);
  ctx.lineTo(x+r[3],y+h);ctx.arcTo(x,y+h,x,y+h-r[3],r[3]);
  ctx.lineTo(x,y+r[0]);ctx.arcTo(x,y,x+r[0],y,r[0]);
  ctx.closePath();
}
function mkGrid(){grid=[];for(let r=0;r<N;r++){grid[r]=[];for(let c=0;c<N;c++)grid[r][c]=Math.floor(Math.random()*COLORS.length);}}
function flood(newC){
  const oldC=grid[0][0];if(oldC===newC)return;
  const stack=[[0,0]],visited=new Set(["0,0"]);
  while(stack.length){const[r,c]=stack.pop();grid[r][c]=newC;[[r-1,c],[r+1,c],[r,c-1],[r,c+1]].forEach(([nr,nc])=>{const k=`${nr},${nc}`;if(nr>=0&&nr<N&&nc>=0&&nc<N&&!visited.has(k)&&grid[nr][nc]===oldC){visited.add(k);stack.push([nr,nc]);}});}
  moves++;document.getElementById("mv").textContent=moves;
  draw();
  sndCollect();
  if(window.GameFX)GameFX.burst(cv,cv.clientWidth/2,cv.clientHeight/2,{colors:COLORS,count:10,spread:2.5,life:.45});
  const all=grid.flat().every(v=>v===grid[0][0]);
  if(all){
    const bonus=Math.max(0,(maxMoves-moves))*level*10+100;
    score+=bonus;level++;maxMoves=Math.max(15,25-level*2);moves=0;
    document.getElementById("sc").textContent=score;document.getElementById("lv").textContent=level;document.getElementById("mx").textContent=maxMoves;document.getElementById("mv").textContent=0;
    sndWin();
    if(window.GameFX){GameFX.burst(cv,cv.clientWidth/2,cv.clientHeight/2,{colors:COLORS,count:36,spread:5,life:.9,gravity:.2});GameFX.shake(cv,{intensity:5,duration:220});GameFX.popup(cv,cv.clientWidth/2,cv.clientHeight/2,'+'+bonus,{color:'#ffd93d',size:26});}
    setTimeout(()=>{mkGrid();draw();},600);
  }
  else if(moves>=maxMoves){sndLose();setTimeout(()=>{document.getElementById('fail-sc').textContent=score;document.getElementById('fail-ov').style.display='flex';},200);}
}
function drawCell(r,c,colorIdx){
  const pad=1.5,x=c*SZ+pad,y=r*SZ+pad,s=SZ-pad*2,rnd=s*0.3;
  const col=COLORS[colorIdx];
  const grad=ctx.createLinearGradient(x,y,x,y+s);
  grad.addColorStop(0,lighten(col,35));
  grad.addColorStop(.55,col);
  grad.addColorStop(1,darken(col,25));
  ctx.fillStyle=grad;
  roundRect(x,y,s,s,rnd);ctx.fill();
  const shine=ctx.createLinearGradient(x,y,x,y+s*0.45);
  shine.addColorStop(0,'rgba(255,255,255,.5)');
  shine.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=shine;
  roundRect(x,y,s,s*0.42,[rnd,rnd,0,0]);ctx.fill();
}
function draw(){
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#0c0518';
  roundRect(0,0,cv.width,cv.height,14);ctx.fill();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++) drawCell(r,c,grid[r][c]);
  ctx.strokeStyle="#fff";ctx.lineWidth=3;
  roundRect(2,2,SZ-4,SZ-4,SZ*0.3);ctx.stroke();
}
function mkBtns(){
  const d=document.getElementById("clrs");d.innerHTML="";
  COLORS.forEach((cl,i)=>{
    const b=document.createElement("button");
    b.className='candy-btn';
    b.style.cssText=`width:48px;height:48px;background:radial-gradient(circle at 32% 26%,${lighten(cl,65)},${cl} 55%,${darken(cl,25)} 100%);`;
    b.onclick=()=>{if(running)flood(i);};
    d.appendChild(b);
  });
}
function go(){document.getElementById("ov").style.display="none";running=true;draw();}
function ng(){moves=0;level=1;maxMoves=25;score=0;document.getElementById("mv").textContent=0;document.getElementById("sc").textContent=0;document.getElementById("lv").textContent=1;document.getElementById("mx").textContent=25;mkGrid();if(running)draw();}
mkGrid();mkBtns();draw();

function doRestart(){
  const g=document.getElementById('goov');if(g)g.style.display='none';
  const w=document.getElementById('winov');if(w)w.style.display='none';
  score=0;lives=3;level=1;
  try{document.getElementById('sc').textContent=0;}catch(e){}
  try{document.getElementById('lf').textContent=3;}catch(e){}
  try{document.getElementById('lv').textContent=1;}catch(e){}
  mkLevel&&mkLevel();
  running=true;
  (function lp(){if(!running)return;update();draw();requestAnimationFrame(lp);})();
}
</script>    <script src="../js/game-fx.js"></script>
<script src="../js/mobile-controls.js" defer></script>
